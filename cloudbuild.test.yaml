# `bun run check`, on every pull request to main.
#
# Publishes nothing, reads no secrets, pushes no image. The value is entirely in
# whether the build succeeds — which is why the trigger runs it as an identity
# that can write a log line and do nothing else (`infra/ci/service_accounts.tf`).
#
# **The Postgres arm moved to `cloudbuild.pg.yaml` on 2026-08-28**, and this
# file's own rule is what licensed the split: it said *"split when something
# here starts being skipped, not before"*, and `test:pg` is now skipped on the
# pull requests that cannot affect it. That arm runs on `packages/core-db/**` and
# `drizzle/**` changes, and on every merge to main.
#
# **What that leaves here is not a downgrade.** `bun run check` is the gate a
# person can type, which is exactly why it must run unconditionally: the failure
# mode it guards is somebody committing without typing it. `test:pg` needs a
# container, so nobody types it, which is why it needed a watcher — but a
# watcher on merge is still a watcher, and it costs ~153s on every PR to have it
# earlier.
#
# Why `test:pg` no longer earns a place on every PR is argued in
# `cloudbuild.pg.yaml`, in one line: no test requires a real Postgres, so it is
# a disagreeing measurement rather than coverage.

steps:
  # The gate's image: bun plus git. See docker/ci/Dockerfile for why git.
  # Never pushed. `cloudbuild.pg.yaml` builds its own copy rather than sharing
  # this one -- the two files run as independent builds and cannot borrow.
  - id: ci-image
    name: gcr.io/cloud-builders/docker
    args: [build, -t, labkit-ci, docker/ci]

  # `bun test`, typecheck, depcruise and every `check:*`. Installs its own
  # dependencies; it used to install them for the Postgres arm as well, which
  # shared the workspace -- that arm now installs for itself in
  # `cloudbuild.pg.yaml`.
  #
  # `--frozen-lockfile` so a drifted lockfile fails here rather than being
  # silently updated inside a build nobody keeps.
  - id: check
    name: labkit-ci
    entrypoint: bash
    # `_PR_NUMBER` is empty on a merge build and set on a pull request, which
    # is how the narrowing below tells the two apart.
    env:
      - _PR_NUMBER=$_PR_NUMBER
      - CI=true
    args:
      - -c
      - |
        set -e
        bun install --frozen-lockfile

        # **A pull request tests what it can reach; a merge build tests
        # everything.** `check:changed` narrows the suite to the packages a
        # diff touches, and on a merge build there is no diff to narrow by —
        # HEAD is already main, so it would scope to nothing. `_PR_NUMBER` is
        # empty exactly there, which is the distinction already in hand.
        #
        # Every failure mode of the narrowing runs the whole suite: a fetch
        # that does not land, a base that does not resolve, an empty diff, or
        # a change to anything outside a package.
        if [ -n "$_PR_NUMBER" ] && git fetch --no-tags --depth=50 origin main; then
          bun run check:changed origin/main
        else
          bun run check
        fi

options:
  logging: CLOUD_LOGGING_ONLY
  # An unmatched substitution fails the build before a step runs. Only
  # `test-on-pr` uses this file and it always has `_PR_NUMBER`, but the cost of
  # being wrong is every build red, and an empty value only means "run
  # everything" to the narrowing below.
  substitutionOption: ALLOW_LOOSE

# **Measured on the first green run, 2026-08-26** (build `9907cb31`, 394s total,
# 1s queued), when this file still carried both arms:
#
#   ci-image    20s
#   postgres    12s   -- moved to cloudbuild.pg.yaml
#   check      208s   -- ~112s for the same work locally
#   test-pg    153s   -- moved to cloudbuild.pg.yaml
#
# A worker is roughly **2x slower than a Mac Studio**, which is the number worth
# carrying: the cost here is `bun test` inside `check`. Dropping the Postgres
# arm should put a docs-adjacent PR near 230s rather than 394s -- predicted, not
# measured, and worth replacing with a real figure after the first green run.
timeout: 1800s
