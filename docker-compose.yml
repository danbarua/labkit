services:
  db:
    # Built rather than pulled -- see docker/postgres/Dockerfile for what the
    # image adds (a database, and nothing else) and the rule that keeps it that
    # way. The base image tag is pinned in the Dockerfile so one file names the
    # version.
    build: ./docker/postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=agens
      - POSTGRES_DB=postgres
    ports:
      - ${LABKIT_PORT_DB:-5432}:5432
    # `depends_on: condition: service_healthy` needs this, and the web service
    # needs that: the entrypoint migrates before it serves, and migrating a
    # Postgres that is still starting fails rather than waiting.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The out-of-band deploy step, run once before any server starts.
  #
  # `directPostgresBackend` does not migrate on connect (PJ-004): N processes
  # connecting concurrently with nothing serialising them would race. A service
  # that runs to completion, with the servers waiting on
  # `service_completed_successfully`, is that serialisation. Idempotent, so
  # bringing the stack up again costs one no-op.
  #
  # In both profiles, because both need it and neither should own it.
  migrate:
    profiles: ["spike", "pooler"]
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - LABKIT_DB_URL=postgres://postgres:agens@db:5432/labkit_spike
    command: ["bun", "scripts/spike-migrate.ts"]
    restart: "no"

  # The MCP tools over HTTP, for the spike. **Behind a profile**, so
  # `docker compose up -d db` and `bun run test:pg` cannot start it by accident
  # — `scripts/test-postgres.sh` names `db` explicitly at every call site, and
  # this keeps that true even for someone typing a bare `up`.
  #
  #   docker compose --profile spike up -d --build
  #   curl -s localhost:8899/healthz
  #
  # Its own database, and a third name on purpose: `reset()` truncates
  # `labkit_tests`, so a concurrent test run would eat the spike's data, and
  # `labkit` is the name a real deployment would pick.
  web:
    profiles: ["spike"]
    # Context is the repo root, not the Dockerfile's directory — the app image
    # copies `src/`, `drizzle/` and the lockfile, and none of those live under
    # `docker/webapp/`. `db` above is the other case and stays as it is: its
    # context genuinely is its own directory, because `initdb/` is all it needs.
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - LABKIT_DB_URL=postgres://postgres:agens@db:5432/labkit_spike
      - LABKIT_TENANT=labkit
    ports:
      - ${LABKIT_PORT_WEB:-8899}:8899

  # PgBouncer in **transaction** pooling mode, for one experiment.
  #
  # `src/db/scoped.ts` pins the tenant with `set_config(..., false)` and steps
  # down with `SET ROLE` — both **session**-scoped, on the stated premise that
  # "production resolves exactly one tenant per process, at assembly, and never
  # again". Transaction pooling is what breaks that premise: each transaction
  # may land on a different backend, and `scopeToTenant` runs *outside* any
  # transaction while every verb opens its own.
  #
  # `default_pool_size=1` on purpose: one shared backend makes the interleaving
  # deterministic rather than racy. Its own profile, so `spike:web` and
  # `test:pg` cannot start it.
  pgbouncer:
    profiles: ["pooler"]
    image: edoburu/pgbouncer:v1.23.1-p2
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=agens
      # The variable under test. `transaction` is the arm; `session` is the
      # control, and is what anyone would actually deploy.
      - POOL_MODE=${LABKIT_POOL_MODE:-transaction}
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=1
      - AUTH_TYPE=scram-sha-256
      - ADMIN_USERS=postgres
    ports:
      - ${LABKIT_PORT_POOLER:-6432}:5432

  # Two servers, two tenants, one pooler. Two are needed because a tenant is
  # per process (measured: PR #91's finding 2), so "client A saw tenant B's
  # rows" is unobservable with one.
  web-alpha:
    profiles: ["pooler"]
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    environment:
      # `LABKIT_PG_HOST=db` is the no-pooler control.
      - LABKIT_DB_URL=postgres://postgres:agens@${LABKIT_PG_HOST:-pgbouncer}:5432/labkit_spike
      - LABKIT_TENANT=alpha
    ports:
      - ${LABKIT_PORT_ALPHA:-8901}:8899

  web-beta:
    profiles: ["pooler"]
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    environment:
      - LABKIT_DB_URL=postgres://postgres:agens@${LABKIT_PG_HOST:-pgbouncer}:5432/labkit_spike
      - LABKIT_TENANT=beta
    ports:
      - ${LABKIT_PORT_BETA:-8902}:8899
