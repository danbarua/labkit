# `bun run check`, on GitHub's runners, beside the Cloud Build gate rather than instead of it.
#
# A spike, to answer three questions with numbers rather than argument:
#
#   1. How long does the same work take here? `cloudbuild.test.yaml` sets no
#      `machineType`, so it runs on the default worker, and its own footer
#      records the consequence: "a worker is roughly 2x slower than a Mac
#      Studio". A public repository gets 4-core runners at no cost.
#   2. Can a JUnit report be published? On Cloud Build it cannot, without
#      granting the CI identity a bucket it deliberately does not have. Here it
#      is an upload step.
#   3. What does the image cost buy? `docker/ci/Dockerfile` exists to add git to
#      `oven/bun`. A runner has git, so that step and its `safe.directory`
#      workaround are simply absent here.
#
# **Not a gate.** Cloud Build remains the required check while this runs. Delete
# this file, or promote it and delete `cloudbuild.test.yaml` — but not both at
# once, because the comparison is the point.
#
# retire-when: the numbers are in and one of the two CI paths is chosen.

name: check (spike)

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Read the code and nothing else. `GITHUB_TOKEN` is broader by default, and the
# Cloud Build identity this is compared against "may write a log line and do
# nothing else" -- a property worth keeping rather than losing in the move.
permissions:
  contents: read

# A second push supersedes the first. The gate answers the head commit.
concurrency:
  group: check-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `check:changed` narrows the suite by diffing against main, and
      # `check:no-tracked-symlinks` runs `git ls-files`, so this needs real
      # history rather than the single commit a default checkout gives.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # Pinned to the version `docker/ci/Dockerfile` pins, so the two CI paths
      # are running the same runtime and the comparison means something.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The same narrowing Cloud Build does, for the same reason: a pull request
      # tests what it can reach. Every failure of the narrowing runs everything.
      - name: check
        run: |
          set -e
          if git fetch --no-tags --depth=50 origin main; then
            bun run check:changed origin/main
          else
            bun run check
          fi

      # **The thing Cloud Build cannot do.** `bun test` writes `junit.xml` and
      # `check-all.ts` reads it to print a failure digest; there, the file dies
      # with the container. Uploaded on failure too -- especially on failure.
      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
          if-no-files-found: warn
