# On a pull request: the suite in five shards, the other checks beside them, and
# `run-ci-build` over the top as the one name branch protection knows.
# On a merge to main: the suite again against real Postgres, and a `v0.7.<pull request>`
# tag, which is where the version number lives.
#
# **The version is a tag, not a tracked file.** Writing it into `package.json` made every
# open pull request conflict on that one line the moment any of them merged, and a bot
# cannot push the correction to a protected main. A tag can be pushed, and it answers the
# question a version is asked: `0.7.470` is that release, `0.7.470+3.g7c7cd1e (branch)` is
# somebody's build.

name: CI Build

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

jobs:
  # Tags the merge `v0.7.<pull request>`, which is where the version number lives.
  #
  # A tag rather than a commit: `package.json` used to carry the number, and writing it
  # there made every open pull request conflict on that line the moment one of them merged
  # — and a bot cannot push the correction to a protected main anyway, which is how this
  # job failed on #470: "Protected branch update failed … Required status check
  # run-ci-build is expected". Tags are not branch-protected.
  #
  # A binary built from this commit then says `0.7.470` and nothing else. One built from
  # anywhere else says `0.7.470+3.g7c7cd1e (some-branch)`, which is the question a version
  # is being asked: released, or scratch?
  tag-the-merge:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'version-bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: tag this merge with the pull request that shipped it
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # A direct push names no pull request, and gets no tag rather than a guessed one.
          pr=$(printf '%s' "$SUBJECT" | head -1 | sed -n 's/.*(#\([0-9]\{1,\}\)).*/\1/p')
          if [ -z "$pr" ]; then
            echo "no pull request number in: $(printf '%s' "$SUBJECT" | head -1)"
            exit 0
          fi
          series=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          tag="v${series}.${pr}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already here"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "tagged $tag"

  # The suite, split five ways. Round-robin over the sorted file list, so a new
  # test file joins a shard without anyone updating one. Measured 34.6s-42.7s
  # a shard, against 192s in one run.
  test-shard:
    name: PR tests [${{ matrix.shard }} of 5]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: test
        run: |
          bun run test -- $(bun scripts/lib/shard.ts --of 5 --index ${{ matrix.shard }}) \
            --reporter=junit --reporter-outfile=junit-${{ matrix.shard }}.xml

      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # The same suite against real Postgres and AGE, four shards against the four
  # labkit_tests_NN databases the image ships. **On merge, not on a pull
  # request**: a shard takes 2m08s-3m13s against PGlite's 29s-45s, and a pull
  # request answering in 1m30s is worth more than catching a
  # Postgres-only defect an hour earlier. PGlite is single-writer and
  # shares one session, so anything about isolation, a session-scoped role or
  # advisory locking under contention can only be *demonstrated* here. It is
  # also a disagreeing decoder: `count(*)` is a string over `pg` and a number
  # over a raw PGlite.
  #
  # The image is the one `docker/postgres` publishes, so a developer running
  # `test:pg` and this job are on the same Postgres.
  test-postgres:
    name: Postgres tests [${{ matrix.shard }} of 4]
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'version-bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: ghcr.io/danbarua/labkit-pg18_age170-base:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agens
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Over TCP, because the entrypoint runs a temporary server during
        # initdb that answers on the unix socket while TCP is still closed.
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LABKIT_DB_URL: postgres://postgres:agens@127.0.0.1:5432/labkit_tests_0${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # **Health says the port answers, not that this server is the one that
      # stays.** The entrypoint runs a temporary server during initdb, and a
      # connection made to it dies when the real one takes over -- which is
      # `error: Connection terminated`, twenty seconds into a test that does
      # ten writes. Three consecutive good connections, then start.
      - name: wait for postgres
        run: |
          ok=0
          for _ in $(seq 1 60); do
            if bun -e 'const {Client}=require("pg");const c=new Client({connectionString:process.env.LABKIT_DB_URL});c.connect().then(()=>c.query("select 1")).then(()=>c.end()).then(()=>process.exit(0)).catch(()=>process.exit(1))' 2>/dev/null; then
              ok=$((ok + 1))
              [ "$ok" -ge 3 ] && break
            else
              ok=0
            fi
            sleep 1
          done
          [ "$ok" -ge 3 ] || { echo "postgres never settled"; exit 1; }

      - name: test against postgres
        run: |
          bun run test -- $(bun scripts/lib/shard.ts --of 4 --index ${{ matrix.shard }}) \
            --timeout 60000 \
            --reporter=junit --reporter-outfile=junit-pg-${{ matrix.shard }}.xml

      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-pg-${{ matrix.shard }}
          path: junit-pg-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # Everything the suite is not: typecheck, depcruise, every `check:*`, the
  # compiled binary and the CLI. `check:quick` is the first three.
  other-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run check:quick
      - run: bun run check:cli
      - run: bun run check:binary

  # **The required check, and the only name branch protection knows.** It has
  # no `name:` on purpose: setting one renames the check, and a protection rule
  # naming a status nothing reports blocks every pull request forever. Whatever
  # runs underneath can be renamed, split or replaced without the protection
  # rule going stale and blocking every pull request on a status nothing
  # reports -- which is what happened on #463.
  run-ci-build:
    if: always() && github.event_name == 'pull_request'
    needs: [test-shard, other-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@v4
        with:
          path: junit
          pattern: junit-*
          merge-multiple: true

      - name: summarise the tests
        if: always()
        run: bun scripts/lib/junit-summary.ts junit >> "$GITHUB_STEP_SUMMARY"

      - name: fail if anything under this did
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
