# On a pull request: the suite in five shards, the other checks beside them,
# and `run-ci-build` over the top as the one name branch protection knows.
# On a merge to main: the suite again against real Postgres, and the version
# number set to the pull request that shipped it.
#
# **The version is written on main, never on a branch.** A stamp that edits
# `package.json` on a pull request makes every other open one conflict on that
# line the moment any of them merges: #463 was re-conflicted twice in ten
# minutes. The same bot push also raised a second run of this workflow that
# GitHub blocks or fails at startup. One cause, three symptoms.

name: CI Build

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

jobs:
  # Reads the pull request number out of the squash commit's subject, which is
  # where GitHub puts it: "Some title (#463)".
  bump-package-version:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'version-bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set the patch number to the pull request that shipped
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # A merge that names no pull request -- a direct push -- leaves the
          # version alone rather than guessing a number for it.
          pr=$(printf '%s' "$SUBJECT" | head -1 | sed -n 's/.*(#\([0-9]\{1,\}\)).*/\1/p')
          if [ -z "$pr" ]; then
            echo "no pull request number in: $(printf '%s' "$SUBJECT" | head -1)"
            exit 0
          fi
          current=$(node -p "require('./package.json').version")
          wanted="$(echo "$current" | cut -d. -f1-2).$pr"
          if [ "$current" = "$wanted" ]; then
            echo "version is already $current"
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const file = "package.json";
            const text = fs.readFileSync(file, "utf8");
            const next = process.argv[1];
            // Rewritten by hand rather than through JSON.stringify, which would
            // reformat every other line and bury the one that changed.
            fs.writeFileSync(file, text.replace(/("version":\s*")[^"]+(")/, `$1${next}$2`));
          ' "$wanted"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "version-bump: v$wanted"
          git push origin HEAD:main
          echo "version $current -> $wanted"

  # The suite, split five ways. Round-robin over the sorted file list, so a new
  # test file joins a shard without anyone updating one. Measured 34.6s-42.7s
  # a shard, against 192s in one run.
  test-shard:
    name: PR tests [${{ matrix.shard }} of 5]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: test
        run: |
          bun run test -- $(bun scripts/shard.ts --of 5 --index ${{ matrix.shard }}) \
            --reporter=junit --reporter-outfile=junit-${{ matrix.shard }}.xml

      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # The same suite against real Postgres and AGE, four shards against the four
  # labkit_tests_NN databases the image ships. **On merge, not on a pull
  # request**: a shard takes 2m08s-3m13s against PGlite's 29s-45s, and a pull
  # request answering in 1m30s is worth more than catching a
  # Postgres-only defect an hour earlier. PGlite is single-writer and
  # shares one session, so anything about isolation, a session-scoped role or
  # advisory locking under contention can only be *demonstrated* here. It is
  # also a disagreeing decoder: `count(*)` is a string over `pg` and a number
  # over a raw PGlite.
  #
  # The image is the one `docker/postgres` publishes, so a developer running
  # `test:pg` and this job are on the same Postgres.
  test-postgres:
    name: Postgres tests [${{ matrix.shard }} of 4]
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'version-bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: ghcr.io/danbarua/labkit-pg18_age170-base:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agens
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Over TCP, because the entrypoint runs a temporary server during
        # initdb that answers on the unix socket while TCP is still closed.
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LABKIT_DB_URL: postgres://postgres:agens@127.0.0.1:5432/labkit_tests_0${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # **Health says the port answers, not that this server is the one that
      # stays.** The entrypoint runs a temporary server during initdb, and a
      # connection made to it dies when the real one takes over -- which is
      # `error: Connection terminated`, twenty seconds into a test that does
      # ten writes. Three consecutive good connections, then start.
      - name: wait for postgres
        run: |
          ok=0
          for _ in $(seq 1 60); do
            if bun -e 'const {Client}=require("pg");const c=new Client({connectionString:process.env.LABKIT_DB_URL});c.connect().then(()=>c.query("select 1")).then(()=>c.end()).then(()=>process.exit(0)).catch(()=>process.exit(1))' 2>/dev/null; then
              ok=$((ok + 1))
              [ "$ok" -ge 3 ] && break
            else
              ok=0
            fi
            sleep 1
          done
          [ "$ok" -ge 3 ] || { echo "postgres never settled"; exit 1; }

      - name: test against postgres
        run: |
          bun run test -- $(bun scripts/shard.ts --of 4 --index ${{ matrix.shard }}) \
            --timeout 60000 \
            --reporter=junit --reporter-outfile=junit-pg-${{ matrix.shard }}.xml

      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-pg-${{ matrix.shard }}
          path: junit-pg-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # Everything the suite is not: typecheck, depcruise, every `check:*`, the
  # compiled binary and the CLI. `check:quick` is the first three.
  other-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run check:quick
      - run: bun run check:cli
      - run: bun run check:binary

  # **The required check, and the only name branch protection knows.** It has
  # no `name:` on purpose: setting one renames the check, and a protection rule
  # naming a status nothing reports blocks every pull request forever. Whatever
  # runs underneath can be renamed, split or replaced without the protection
  # rule going stale and blocking every pull request on a status nothing
  # reports -- which is what happened on #463.
  run-ci-build:
    if: always() && github.event_name == 'pull_request'
    needs: [test-shard, other-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@v4
        with:
          path: junit
          pattern: junit-*
          merge-multiple: true

      - name: summarise the tests
        if: always()
        run: bun scripts/junit-summary.ts junit >> "$GITHUB_STEP_SUMMARY"

      - name: fail if anything under this did
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
