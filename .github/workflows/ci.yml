# Two jobs, named for what they do: `run-ci-build` runs the gate on every pull
# request, and `bump-package-version` writes the version number on main after
# a merge.
#
# `labkit --version` names its own change: 0.7.426 came from #426. The number
# is written **on main, after the merge**, and never on a branch.
#
# **Why not on the branch, which is where this started.** A stamp that edits
# `package.json` on every pull request makes every other open pull request
# conflict on that one line the moment one of them merges — measured on #463,
# which was re-conflicted twice in ten minutes by #462, #465 and #466 landing.
# It also pushed a bot commit to the branch, which raised a second run of this
# workflow that GitHub either blocks as `action_required` or fails at startup
# with no jobs. One cause, three symptoms, all of them gone when branches stop
# touching the line.
#
# `scripts/check-version.ts` is deleted with this change, and its own
# `retire-when:` is why: "the version is written by the merge rather than by
# hand". It is.

name: Run CI build on pull requests, bump package version on merge

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

jobs:
  # Reads the pull request number out of the squash commit's subject, which is
  # where GitHub puts it: "Some title (#463)".
  bump-package-version:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'version-bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set the patch number to the pull request that shipped
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # A merge that names no pull request -- a direct push -- leaves the
          # version alone rather than guessing a number for it.
          pr=$(printf '%s' "$SUBJECT" | head -1 | sed -n 's/.*(#\([0-9]\{1,\}\)).*/\1/p')
          if [ -z "$pr" ]; then
            echo "no pull request number in: $(printf '%s' "$SUBJECT" | head -1)"
            exit 0
          fi
          current=$(node -p "require('./package.json').version")
          wanted="$(echo "$current" | cut -d. -f1-2).$pr"
          if [ "$current" = "$wanted" ]; then
            echo "version is already $current"
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const file = "package.json";
            const text = fs.readFileSync(file, "utf8");
            const next = process.argv[1];
            // Rewritten by hand rather than through JSON.stringify, which would
            // reformat every other line and bury the one that changed.
            fs.writeFileSync(file, text.replace(/("version":\s*")[^"]+(")/, `$1${next}$2`));
          ' "$wanted"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "version-bump: v$wanted"
          git push origin HEAD:main
          echo "version $current -> $wanted"

  # `bun run check` on GitHub's runners, beside the Cloud Build gate rather
  # than instead of it. Measured on #465, same pull request, content identical
  # but for one line:
  #
  #   total        Cloud Build 9m40s   runner 6m19s
  #   test step    Cloud Build  604s   runner  320s
  #   check:cli    Cloud Build   75s   runner   26s
  #
  # No image step: `docker/ci/Dockerfile` exists to add git to `oven/bun`, and
  # a runner has git. Bun is pinned to the version that Dockerfile pins.
  #
  # **Not a gate.** Cloud Build remains the required check while this runs.
  #
  # retire-when: the numbers are in and one of the two CI paths is chosen.
  run-ci-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `check:changed` narrows the suite by diffing against main, and
      # `check:no-tracked-symlinks` runs `git ls-files`, so this needs real
      # history rather than the single commit a default checkout gives.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The same narrowing Cloud Build does, for the same reason: a pull
      # request tests what it can reach. Every failure of it runs everything.
      - name: check
        run: |
          set -e
          if git fetch --no-tags --depth=50 origin main; then
            bun run check:changed origin/main
          else
            bun run check
          fi

      # **The thing Cloud Build cannot do**, without granting its identity a
      # bucket it deliberately does not have. Uploaded on failure too.
      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
          if-no-files-found: warn
