# The patch number is the pull request that ships it, written rather than asked
# for, and then the gate runs against what was written.
#
# `labkit --version` then names its own change: 0.7.426 is #426. Cloud Build
# checks the same rule (`scripts/check-version.ts`) but cannot write it — its
# identity may write a log line and nothing else. GITHUB_TOKEN already carries
# repo write, so the correction costs no new permission.
#
# **One workflow, because there is one pipeline.** `stamp` writes the version
# and `check` reads it, so as two workflows on one event they started together
# and the check lost the race — measured on #465, which failed `check:version`
# with "version is 0.7.462, and this is pull request #465" while the stamp was
# still running. Cloud Build never saw it, being slow enough that the stamp
# always landed first. `needs: stamp` is the whole fix, and it only exists
# inside a workflow.
#
# The bot's own push cannot loop. It does raise a second `pull_request` run,
# which GitHub blocks as `action_required` and never executes — measured on #427,
# where the stamp rewrote 0.7.1 to 0.7.427 and the follow-on run sat pending.
# That pending run is not a required check on main, so it blocks no merge.

name: Version names its pull request, then the gate runs

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  stamp:
    # A fork's token is read-only, and this repository takes no fork pull
    # requests. Skipping is honest: Cloud Build's check still fails such a PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # The default token cannot push; persist it so the commit below can.
          persist-credentials: true

      - name: Set the patch number to this pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          wanted="$(echo "$current" | cut -d. -f1-2).$PR"
          if [ "$current" = "$wanted" ]; then
            echo "version is already $current"
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const file = "package.json";
            const text = fs.readFileSync(file, "utf8");
            const next = process.argv[1];
            // Rewritten by hand rather than through JSON.stringify, which would
            // reformat every other line and bury the one that changed.
            fs.writeFileSync(file, text.replace(/("version":\s*")[^"]+(")/, `$1${next}$2`));
          ' "$wanted"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "version-bump: v$wanted"
          git push origin HEAD:"${{ github.head_ref }}"
          echo "version $current -> $wanted"

  # `bun run check` on GitHub's runners, beside the Cloud Build gate rather than
  # instead of it. A spike, and these are the numbers it was opened to get
  # (#465, same pull request, content identical but for the version line):
  #
  #   total        Cloud Build 9m40s   runner 6m19s
  #   test step    Cloud Build  604s   runner  320s
  #   check:cli    Cloud Build   75s   runner   26s
  #
  # No image step: `docker/ci/Dockerfile` exists to add git to `oven/bun`, and
  # a runner has git, so that build and its `safe.directory` workaround are
  # simply absent. Bun is pinned to the version that Dockerfile pins, so the
  # comparison is like for like.
  #
  # **Not a gate.** Cloud Build remains the required check while this runs.
  #
  # retire-when: the numbers are in and one of the two CI paths is chosen.
  check:
    # After the stamp, and only after: this job runs `check:version`, which
    # reads the number the job above writes.
    needs: stamp
    runs-on: ubuntu-latest
    # Read the code and nothing else. `stamp` above asks for `contents: write`
    # and this does not, so the gate cannot write to the branch it is judging.
    permissions:
      contents: read
    steps:
      # `check:changed` narrows the suite by diffing against main, and
      # `check:no-tracked-symlinks` runs `git ls-files`, so this needs real
      # history rather than the single commit a default checkout gives.
      #
      # `ref` is the branch, not the merge commit: the stamp just pushed to it,
      # and the default checkout of a pull request predates that push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 50

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The same narrowing Cloud Build does, for the same reason: a pull request
      # tests what it can reach. Every failure of the narrowing runs everything.
      - name: check
        run: |
          set -e
          if git fetch --no-tags --depth=50 origin main; then
            bun run check:changed origin/main
          else
            bun run check
          fi

      # **The thing Cloud Build cannot do.** `bun test` writes `junit.xml` and
      # `check-all.ts` reads it to print a failure digest; there, the file dies
      # with the container. Uploaded on failure too -- especially on failure.
      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
          if-no-files-found: warn
