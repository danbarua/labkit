# Builds the docker images and pushes them to GHCR.
#
# Named <project>-<dependencies>-<usage>:
#
#   labkit-pg18_age170-base              Postgres 18, Apache AGE 1.7.0, and the
#                                        four labkit_tests_NN databases.
#
# The versions are in the name so `docker ps` says what a container is without
# anyone having to look it up. The tag is the commit that built it, plus
# `latest`.
name: Build and push the docker images to GHCR

on:
  push:
    branches: [main]
    paths:
      - docker/postgres/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

jobs:
  push-base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/labkit-pg18_age170-base:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/labkit-pg18_age170-base:latest
