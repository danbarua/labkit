[package]
name = "labkit-grafeo"
version = "0.1.0"
edition = "2024"

# `lpg` is the only feature the port (src/main.rs) uses — no query strings
# anywhere in it, per the README. `temporal`, `cypher` and `gql` are here only
# for `examples/epoch_probe*.rs`, which measure the epoch dispute recorded in
# exo-ledger; the binary itself never calls a session or a query string.
[dependencies]
grafeo = { version = "0.5.42", default-features = false, features = ["lpg", "temporal", "cypher", "gql"] }
# For LABKIT_TRACE_OUT's NDJSON — a peer team's reader parses this, so
# hand-rolled string escaping is the wrong place to save a dependency.
serde_json = "1"
